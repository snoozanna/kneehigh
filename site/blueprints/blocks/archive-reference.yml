name: Archive Object
icon: 📖
preview: fields
wysiwyg: true
fields:
  pages:
    label: Archive Objects
    type: pages
    multiple: true
    query: site.index.filterBy("intendedTemplate", "archive-object")
    text: "{{ page.description.or(page.title) }}"
    info: "{{ page.slug }}"
    help: Select one or more archive objects to embed inline
  display:
    label: Display style
    type: select
    options:
      card: Card (image + title + metadata)
      inline: Inline link
      quote: Quote
      studio: In The Studio
      video: Video
      music: Music
      external: External Link
    default: card
