# blueprints/pages/person.yml
title: Person
icon: 👤
status:
  draft:
    label: Draft
    text: The person is still in draft mode. It can only be seen by editors with panel access.
  unlisted:
    label: In Review
    text: The person is online and can be visited with the direct URL. The team must still give the final go to publish it.
  listed:
    label: Published
    text: The person is online and listed in the blog
columns:
  - width: 2/3
    # This columns only has a single field
    fields:
      cover: fields/cover
      headline:
        type: text
        placeholder: "{{ page.title }}"
        help: Leave empty to use the title as headline
      text:
        type: blocks
        # fieldsets:
        # - box
        # - heading
        # - accordion
        # - faq
        # - faq2
        # - card

  - width: 1/3
    # This second column holds a fields section with multiple fields
    # More about fields sections: https://getkirby.com/docs/reference/panel/sections/fields
    sections:
      meta:
        type: fields
        fields:
          roles:
            label: Role
            type: checkboxes
            options:
              performer: Performer
              musician: Musician
              composer: Composer
              producer: Producer
              production-stage-management: Production Stage Management
              writer: Writer
              management-team: Management Team
              artist: Artist
              theatre-maker: Theatre Maker
              designer: Designer
              creator-of-the-rambles-project: Creator of the Rambles Project
              director: Director
              artistic-director: Artistic Director
              lighting-designer: Lighting Designer
              founder: Founder
              photographer: Photographer
              filmmaker: Filmmaker
              puppet-designer: Puppet Designer
              prop-designer: Prop Designer
              choreographer: Choreographer
      files:
        type: files
        template: blocks/image
